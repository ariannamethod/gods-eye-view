name: USGS earthquake classification QA

on:
  push:
    branches: [qa/usgs-earthquake-event-type]

permissions:
  contents: read

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci
      - name: Test PR head
        id: prtrack
        shell: bash
        run: |
          node_modules/.bin/vite --host 127.0.0.1 --port 4173 --strictPort > tracking-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4173/ -o /dev/null && break
            sleep 1
          done
          npm run test:track -- --url http://127.0.0.1:4173 --offline-imagery 2>&1 | tee tracking-qa.log
      - name: Check out upstream on the same runner after a PR failure
        if: failure() && steps.prtrack.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a274d10038ea1233a94b740ec279bb3f3ad8e206
          path: upstream-control
          persist-credentials: false
      - name: Install upstream dependencies
        if: failure() && steps.prtrack.outcome == 'failure'
        working-directory: upstream-control
        run: npm ci
      - name: Test upstream control
        if: failure() && steps.prtrack.outcome == 'failure'
        working-directory: upstream-control
        shell: bash
        run: |
          node_modules/.bin/vite --host 127.0.0.1 --port 4173 --strictPort > tracking-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4173/ -o /dev/null && break
            sleep 1
          done
          npm run test:track -- --url http://127.0.0.1:4173 --offline-imagery 2>&1 | tee tracking-qa.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: usgs-qa-tracking-evidence
          path: |
            tracking-dev.log
            tracking-qa.log
            qa-artifacts/
            upstream-control/tracking-qa.log
            upstream-control/tracking-dev.log
            upstream-control/qa-artifacts/
          if-no-files-found: ignore
          retention-days: 3
